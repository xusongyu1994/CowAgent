                <div id="view-projects" class="view">
                    <div class="flex-1 overflow-y-auto p-6">
                        <div class="max-w-7xl mx-auto">

                            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                                <div>
                                    <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100" data-i18n="projects_title">项目管理</h2>
                                    <p class="text-sm text-slate-500 dark:text-slate-400 mt-1" data-i18n="projects_desc">上传项目 Excel 文件，自动分析进度并检测停滞项目</p>
                                </div>
                            </div>

                            <!-- Upload Area -->
                            <div id="projects-upload-area" class="border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-2xl p-10 text-center cursor-pointer transition-all duration-150 hover:border-primary-400 hover:bg-primary-50/30 dark:hover:bg-primary-500/5 mb-6 drag-over-zone">
                                <div id="projects-upload-idle">

                                    <p class="text-sm text-slate-500 dark:text-slate-400" data-i18n="projects_upload_hint">拖拽 Excel 文件到此处，或点击上传</p>
                                    <p class="text-xs text-slate-400 dark:text-slate-500 mt-1" data-i18n="projects_upload_supported">支持 .xlsx 格式</p>
                                    <button id="projects-upload-btn" class="mt-4 px-5 py-2 rounded-xl bg-primary-500 hover:bg-primary-600 text-white text-sm font-medium transition-colors duration-150 cursor-pointer" data-i18n="projects_upload_btn">选择文件</button>
                                    <input id="projects-file-input" type="file" accept=".xlsx,.xls" class="hidden">
                                </div>
                                <div id="projects-upload-loading" class="hidden">
                                    <i class="fas fa-spinner fa-spin text-3xl text-primary-500 mb-3"></i>
                                    <p class="text-sm text-slate-500 dark:text-slate-400" data-i18n="projects_upload_loading">正在解析和分析数据...</p>
                                </div>
                            </div>

                            <!-- Stats Cards -->
                            <div id="projects-stats" class="hidden grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6"></div>

                            <!-- Stalled Projects Alert -->
                            <div id="projects-stalled-section" class="hidden mb-6">
                                <div class="bg-red-50 dark:bg-red-900/10 border border-red-200 dark:border-red-800 rounded-xl p-4">
                                    <div class="flex items-center gap-3 mb-3">
                                        <i class="fas fa-exclamation-triangle text-red-500"></i>
                                        <h3 class="font-semibold text-red-700 dark:text-red-400 text-sm" data-i18n="projects_stalled_title">停滞项目预警</h3>
                                    </div>
                                    <p class="text-xs text-red-600 dark:text-red-400 mb-3" data-i18n="projects_stalled_desc">以下项目已超过 30 天未更新进度</p>
                                    <div id="projects-stalled-list" class="space-y-2"></div>
                                </div>
                            </div>

                            <!-- No date column hint -->
                            <div id="projects-no-date-hint" class="hidden bg-amber-50 dark:bg-amber-900/10 border border-amber-200 dark:border-amber-800 rounded-xl p-4 mb-6">
                                <div class="flex items-center gap-3">
                                    <i class="fas fa-calendar-alt text-amber-500"></i>
                                    <p class="text-sm text-amber-700 dark:text-amber-400" data-i18n="projects_error_no_date">未检测到日期列，无法分析停滞项目</p>
                                </div>
                            </div>

                            <!-- Loading (hidden by default, shown during analysis) -->
                            <div id="projects-loading" class="hidden flex flex-col items-center justify-center py-20">
                                <i class="fas fa-spinner fa-spin text-3xl text-primary-500 mb-3"></i>
                                <p class="text-sm text-slate-400" data-i18n="projects_upload_loading">正在解析和分析数据...</p>
                            </div>

                            <!-- Error -->
                            <div id="projects-error" class="hidden bg-red-50 dark:bg-red-900/10 border border-red-200 dark:border-red-800 rounded-xl p-4 mb-6">
                                <div class="flex items-center gap-3">
                                    <i class="fas fa-exclamation-triangle text-red-500"></i>
                                    <p id="projects-error-msg" class="text-sm text-red-700 dark:text-red-400"></p>
                                </div>
                            </div>

                            <!-- All Data Table -->
                            <div id="projects-table-section" class="hidden mb-6">
                                <h3 class="text-lg font-semibold text-slate-800 dark:text-slate-100 mb-3" data-i18n="projects_table_title">全部项目数据</h3>
                                <div class="overflow-x-auto bg-white dark:bg-[#1A1A1A] rounded-xl border border-slate-200 dark:border-white/10">
                                    <table class="w-full text-sm">
                                        <thead id="projects-table-head" class="bg-slate-50 dark:bg-white/5"></thead>
                                        <tbody id="projects-table-body"></tbody>
                                    </table>
                                </div>
                            </div>

                            <!-- Empty hint for no identifiable columns -->
                            <div id="projects-empty-tip" class="hidden flex flex-col items-center justify-center py-16">
                                <i class="fas fa-table text-4xl text-slate-300 dark:text-slate-600 mb-3"></i>
                                <p class="text-sm text-slate-400" data-i18n="projects_error_no_name">未检测到项目名列</p>
                            </div>
                        </div>
                    </div>
                </div>
